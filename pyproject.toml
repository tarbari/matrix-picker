[project]
name = "matrix-picker"
version = "0.2.0"
description = "Team builder for the Wuthering Waves Endstate Matrix event, with a desktop GUI and CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6-essentials>=6.7",
]

[project.scripts]
matrix-picker = "matrix_picker:main"

[project.gui-scripts]
matrix-picker-gui = "matrix_picker.gui:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
